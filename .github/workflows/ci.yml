name: CI

on:
    push:
        branches: ['**']
    pull_request:

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 12.4.1

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile=false

            - name: Lint
              run: pnpm run lint

            - name: Typecheck
              run: pnpm run typecheck

            - name: Build webapp
              run: pnpm run webapp:build
              env:
                  POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/ee
                  BETTER_AUTH_SECRET: ci-only-not-a-real-secret
                  BETTER_AUTH_URL: http://localhost:3000
                  ADMIN_INITIAL_PASSWORD: ci-only-not-a-real-password

            - name: Build mobile
              run: pnpm run mobile:build

            - name: Smoke test
              run: pnpm run test
